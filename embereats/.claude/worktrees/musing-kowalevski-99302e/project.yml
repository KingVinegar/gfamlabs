name: EmberEats
options:
  bundleIdPrefix: com.gfamlabs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    INFOPLIST_KEY_CFBundleDisplayName: EmberEats
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.food-and-drink"
    DEVELOPMENT_TEAM: "7XS3QMA32B"
targets:
  EmberEats:
    type: application
    platform: iOS
    sources:
      - path: EmberEats
        excludes:
          - "*.storekit"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gfamlabs.EmberEats
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: EmberEats/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    dependencies: []
schemes:
  EmberEats:
    build:
      targets:
        EmberEats: all
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
    archive:
      config: Release
